<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>株式会社HAZEN</title>
<meta name="description" content="株式会社HAZEN（ハゼン）は、人事・組織コンサルティング・採用支援を行う会社です。">
<meta property="og:type" content="website">
<meta property="og:title" content="株式会社HAZEN">
<meta property="og:description" content="人事・組織コンサルティング・採用支援">
<meta property="og:url" content="https://ha-zen.co.jp/">
<meta property="og:image" content="https://ha-zen.co.jp/assets/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  :root { --navy: #133649; --ink: #141414; --sub: #5C6166; --pale: #F0F4F7; --line: #D3DCE2; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; color: var(--ink); background: #fff; line-height: 1.8; }
  a { color: var(--navy); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .narrow { max-width: 760px; margin: 0 auto; padding: 0 24px; }

  header { background: var(--pale); }
  header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 20px; padding-bottom: 20px; }
  .brand { display: block; line-height: 0; }
  .brand img { height: 22px; width: auto; display: block; }
  nav { display: flex; gap: 28px; font-size: 13px; letter-spacing: .12em; }
  nav a { text-decoration: none; color: #3B3F43; }
  nav a:hover { color: var(--navy); }

  .hero { background: var(--pale); padding: 168px 24px 200px; display: flex; justify-content: center; }
  .hero h1 { margin: 0; line-height: 0; }
  .hero img { width: 168px; height: auto; display: block; }

  section.block { padding: 104px 0; }
  section.block.alt { background: var(--pale); }
  h2 { margin: 0 0 40px; font-size: 14px; font-weight: 700; letter-spacing: .2em; color: var(--navy); }

  dl { margin: 0; font-size: 15px; }
  dl div { display: flex; flex-wrap: wrap; gap: 4px 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
  dl div:first-child { border-top: 1px solid var(--line); }
  dt { flex: 0 0 120px; color: var(--sub); }
  dd { margin: 0; flex: 1 1 280px; }
  dd .en { font-size: 13px; color: var(--sub); letter-spacing: .04em; }

  .lead { margin: 0 0 8px; font-size: 15px; color: #3B3F43; }
  .mail { font-size: 15px; word-break: break-all; }

  footer { padding: 32px 24px; text-align: center; font-size: 12px; letter-spacing: .1em; color: var(--sub); }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="#top" aria-label="株式会社HAZEN トップへ"><img src="/assets/logo-h.svg" alt="HAZEN" width="78" height="22"></a>
    <nav aria-label="Menu">
      <a href="#company">COMPANY</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </div>
</header>

<main>
  <section id="top" class="hero">
    <h1><img src="/assets/logo.svg" alt="株式会社HAZEN" width="168" height="174"></h1>
  </section>

  <section id="company" class="block">
    <div class="narrow">
      <h2>COMPANY</h2>
      <dl>
        <div><dt>社名</dt><dd>株式会社HAZEN<br><span class="en">HAZEN Inc.</span></dd></div>
        <div><dt>代表者</dt><dd>代表取締役　早川 良太<br><span class="en">CEO　Ryota Hayakawa</span></dd></div>
        <div><dt>設立</dt><dd>2026年10月</dd></div>
        <div><dt>所在地</dt><dd>〒170-0013 東京都豊島区東池袋三丁目13番7号 池三ビル5階</dd></div>
        <div><dt>事業内容</dt><dd>人事・組織コンサルティング<br>採用支援</dd></div>
      </dl>
    </div>
  </section>

  <section id="contact" class="block alt">
    <div class="narrow">
      <h2>CONTACT</h2>
      <p class="lead">お問い合わせは、以下のメールアドレスまでご連絡ください。</p>
      <a class="mail" href="mailto:ryota.hayakawa@ha-zen.co.jp">ryota.hayakawa@ha-zen.co.jp</a>
    </div>
  </section>
</main>

<footer>© 2026 HAZEN Inc.</footer>

</body>
</html>
